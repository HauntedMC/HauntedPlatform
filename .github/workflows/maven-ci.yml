name: Maven CI

on:
  workflow_call:
    inputs:
      maven-command:
        description: Maven command to execute from the repository root.
        required: false
        type: string
        default: ./mvnw -U -B -ntp clean verify
    secrets:
      PACKAGES_USER:
        required: true
      PACKAGES_TOKEN:
        required: true
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PACKAGES_USER: ${{ secrets.PACKAGES_USER || secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.HAUNTEDMC_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate GitHub Packages credentials
        shell: bash
        run: |
          test -n "$PACKAGES_USER" || { echo "Missing GitHub Packages username." >&2; exit 1; }
          test -n "$PACKAGES_TOKEN" || { echo "Missing GitHub Packages token." >&2; exit 1; }
      - name: Run Maven verification
        shell: bash
        run: ${{ inputs.maven-command || 'mvn -U -B -ntp clean verify' }}
      - name: Capture resolved build model
        shell: bash
        run: mvn -U -B -ntp dependency:tree help:effective-pom
