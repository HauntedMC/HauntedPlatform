name: Maven CI

on:
  workflow_call:
    inputs:
      maven-command:
        description: Maven command to execute from the repository root.
        required: false
        type: string
        default: ./mvnw -U -B -ntp clean verify
    secrets:
      PACKAGES_USER:
        required: false
      PACKAGES_TOKEN:
        required: false
      HAUNTEDMC_PACKAGES_USERNAME:
        required: false
      HAUNTEDMC_PACKAGES_TOKEN:
        required: false
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PACKAGES_USER: ${{ secrets.PACKAGES_USER || secrets.HAUNTEDMC_PACKAGES_USERNAME || github.actor }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.HAUNTEDMC_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      - name: Validate GitHub Packages credentials
        shell: bash
        run: |
          test -n "$PACKAGES_USER" || { echo "Missing GitHub Packages username." >&2; exit 1; }
          test -n "$PACKAGES_TOKEN" || { echo "Missing GitHub Packages token." >&2; exit 1; }
      - name: Run Maven verification
        shell: bash
        run: ${{ inputs.maven-command || 'mvn -U -B -ntp clean verify' }}
      - name: Capture resolved build model
        shell: bash
        run: mvn -U -B -ntp dependency:tree help:effective-pom

  platform-consumer-contracts:
    if: github.repository == 'HauntedMC/HauntedPlatform'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PACKAGES_USER: ${{ secrets.PACKAGES_USER || secrets.HAUNTEDMC_PACKAGES_USERNAME || github.actor }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.HAUNTEDMC_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      - name: Validate GitHub Packages credentials
        shell: bash
        run: |
          test -n "$PACKAGES_USER" || { echo "Missing GitHub Packages username." >&2; exit 1; }
          test -n "$PACKAGES_TOKEN" || { echo "Missing GitHub Packages token." >&2; exit 1; }
      - name: Install and verify external consumer contracts
        shell: bash
        env:
          VERIFICATION_REPOSITORY: ${{ runner.temp }}/haunted-platform-local-m2
        run: |
          rm -rf "$VERIFICATION_REPOSITORY"
          mvn -U -B -ntp -Dmaven.repo.local="$VERIFICATION_REPOSITORY" clean install
          mvn -U -B -ntp -Dmaven.repo.local="$VERIFICATION_REPOSITORY" -f verification/bom-consumer/pom.xml clean verify
          mvn -U -B -ntp -Dmaven.repo.local="$VERIFICATION_REPOSITORY" -f verification/library-parent-consumer/pom.xml clean verify
          mvn -U -B -ntp -Dmaven.repo.local="$VERIFICATION_REPOSITORY" -f verification/application-parent-consumer/pom.xml clean verify

          mvn -U -B -ntp -Dmaven.repo.local="$VERIFICATION_REPOSITORY" -f verification/application-parent-consumer/pom.xml dependency:tree help:effective-pom

  static:
    if: github.repository == 'HauntedMC/HauntedPlatform'
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: git diff --check HEAD^ HEAD
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  ci-required:
    if: ${{ always() && github.repository == 'HauntedMC/HauntedPlatform' }}
    name: ci-required
    needs: [verify, platform-consumer-contracts, static]
    runs-on: ubuntu-24.04
    env:
      CHECK_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every validation job
        run: |
          python3 - <<'PY'
          import json
          import os
          results = {name: job['result'] for name, job in json.loads(os.environ['CHECK_RESULTS']).items()}
          failed = {name: result for name, result in results.items() if result != 'success'}
          if failed:
              raise SystemExit(f'Validation did not pass: {failed}')
          PY
