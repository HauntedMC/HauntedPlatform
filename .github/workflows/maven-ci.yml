name: Maven CI

on:
  workflow_call:
    inputs:
      maven-command:
        description: Maven command to execute from the repository root.
        required: false
        type: string
        default: ./mvnw -U -B -ntp clean verify
    secrets:
      PACKAGES_USER:
        required: true
      PACKAGES_TOKEN:
        required: true
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PACKAGES_USER: ${{ secrets.PACKAGES_USER || secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.HAUNTEDMC_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate GitHub Packages credentials
        shell: bash
        run: |
          test -n "$PACKAGES_USER" || { echo "Missing GitHub Packages username." >&2; exit 1; }
          test -n "$PACKAGES_TOKEN" || { echo "Missing GitHub Packages token." >&2; exit 1; }
      - name: Run Maven verification
        shell: bash
        run: ${{ inputs.maven-command || 'mvn -U -B -ntp clean verify' }}
      - name: Capture resolved build model
        shell: bash
        run: mvn -U -B -ntp dependency:tree help:effective-pom

  platform-consumer-contracts:
    if: github.repository == 'HauntedMC/HauntedPlatform'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PACKAGES_USER: ${{ secrets.PACKAGES_USER || secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.HAUNTEDMC_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate GitHub Packages credentials
        shell: bash
        run: |
          test -n "$PACKAGES_USER" || { echo "Missing GitHub Packages username." >&2; exit 1; }
          test -n "$PACKAGES_TOKEN" || { echo "Missing GitHub Packages token." >&2; exit 1; }
      - name: Install and verify external consumer contracts
        shell: bash
        env:
          VERIFICATION_REPOSITORY: ${{ runner.temp }}/haunted-platform-local-m2
        run: |
          rm -rf "$VERIFICATION_REPOSITORY"
          mvn -U -B -ntp -Dmaven.repo.local="$VERIFICATION_REPOSITORY" clean install
          mvn -U -B -ntp -Dmaven.repo.local="$VERIFICATION_REPOSITORY" -f verification/bom-consumer/pom.xml clean verify
          mvn -U -B -ntp -Dmaven.repo.local="$VERIFICATION_REPOSITORY" -f verification/library-parent-consumer/pom.xml clean verify
          mvn -U -B -ntp -Dmaven.repo.local="$VERIFICATION_REPOSITORY" -f verification/application-parent-consumer/pom.xml clean verify
          mvn -U -B -ntp -Dmaven.repo.local="$VERIFICATION_REPOSITORY" -f verification/application-graph-regression/pom.xml clean verify

          mvn -U -B -ntp -Dmaven.repo.local="$VERIFICATION_REPOSITORY" -f verification/application-parent-consumer/pom.xml dependency:tree help:effective-pom
          mvn -U -B -ntp -Dmaven.repo.local="$VERIFICATION_REPOSITORY" -f verification/application-graph-regression/pom.xml dependency:tree help:effective-pom

          assert_property() {
            local expression="$1"
            local expected="$2"
            local actual
            actual="$(mvn -q -Dstyle.color=never -Dmaven.repo.local="$VERIFICATION_REPOSITORY" \
              -f verification/application-parent-consumer/pom.xml \
              help:evaluate -Dexpression="$expression" -DforceStdout)"
            if [[ "$actual" != "$expected" ]]; then
              echo "Expected $expression=$expected but resolved $actual" >&2
              exit 1
            fi
          }

          assert_property haunted.featureframework.version 1.7.0
          assert_property haunted.dataprovider.version 3.3.0
          assert_property haunted.dataregistry.version 1.15.0
          assert_property haunted.observability.version 1.0.1
