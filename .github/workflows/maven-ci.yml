name: Maven CI

on:
  workflow_call:
    secrets:
      MAVEN_USERNAME:
        required: false
      MAVEN_TOKEN:
        required: false
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN
      - run: mvn -B clean verify
      - run: mvn -B dependency:tree help:effective-pom
