name: Feature request
description: Suggest a focused improvement to the HauntedPlatform
title: "[Feature]: "
labels: [enhancement]
body:
  - type: checkboxes
    id: precheck
    attributes:
      label: Pre-check
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This proposal is specific and actionable.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which build, dependency, or release policy is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want and how you would use it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Maven parent and plugin policy
        - External dependency BOMs
        - Consumer contracts
        - Release and dependency updates
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact (optional)
      description: Would consuming repositories need to change their configuration or scripts?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
